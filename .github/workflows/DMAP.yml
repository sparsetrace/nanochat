# .github/workflows/DMAP.yml — HMAP with alpha=1 (kinetic + Doob potential) = DMAP face
name: Train nanochat (DMAP)

on:
  workflow_dispatch:
    inputs:
      depth:
        description: "Transformer depth"
        required: false
        default: "12"
      run_tag:
        description: "Run name (checkpoints/logs/HF paths). Empty = d{depth}"
        required: false
        default: ""
      save_every:
        description: "Checkpoint every N steps"
        required: false
        default: "1000"
      extra_args:
        description: "Extra base_train flags (variant flags already included)"
        required: false
        default: ""

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Modal
        run: pip install modal
      - name: Deploy app
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: modal deploy modal_train.py
      - name: Spawn training (fire-and-forget)
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          DEPTH: ${{ inputs.depth }}
          RUN_TAG: ${{ inputs.run_tag }}
          SAVE_EVERY: ${{ inputs.save_every }}
          EXTRA_ARGS: ${{ inputs.extra_args }}
          HF_SUBFOLDER: DMAP
          VARIANT_ARGS: "--attn-variant hmap --hmap-alpha 1.0 --device-batch-size=8"
        run: |
          python -c "
          import os, modal
          f = modal.Function.from_name('nanochat', 'train_nanochat')
          extra = (os.environ['VARIANT_ARGS'] + ' ' + os.environ['EXTRA_ARGS']).strip()
          call = f.spawn(
              depth=int(os.environ['DEPTH']),
              hf_subfolder=os.environ['HF_SUBFOLDER'],
              save_every=int(os.environ['SAVE_EVERY']),
              run_tag=os.environ['RUN_TAG'],
              extra_args=extra,
          )
          print('launched, call id:', call.object_id)
          "
