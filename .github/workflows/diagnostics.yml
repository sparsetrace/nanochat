name: d32 diagnostics

on:
  workflow_dispatch:
    inputs:
      state:
        description: "Checkpoint alias (d12 series or d32 hysteresis series)"
        required: true
        default: "amap2"
        type: choice
        options:
          - d12-attention
          - d12-amap
          - d12-dmap
          - original
          - amap1
          - attention1
          - amap2

      mode:
        description: "Diagnostics to run"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - bpb
          - icl
          - core
          - sample

      repo:
        description: "Optional HF repo override (leave blank to use state alias)"
        required: false
        default: ""
        type: string

      run_tag:
        description: "Optional run-tag override (leave blank to use state alias)"
        required: false
        default: ""
        type: string

      step:
        description: "Checkpoint step (-1 = newest)"
        required: true
        default: "-1"
        type: string

      operator_override:
        description: "Optional operator override: standard or hmap"
        required: false
        default: ""
        type: string

      eval_tokens:
        description: "Validation tokens for direct bpb evaluation"
        required: true
        default: "524288"
        type: string

      icl_num_batches:
        description: "ICL validation batches (canonical base_train value = 8)"
        required: true
        default: "8"
        type: string

      device_batch_size:
        description: "Per-device diagnostic microbatch (1 is safe for d32 AMAP/HMAP)"
        required: true
        default: "1"
        type: string

      max_per_task:
        description: "Maximum examples per CORE task"
        required: true
        default: "500"
        type: string

      num_samples:
        description: "Samples per prompt"
        required: true
        default: "1"
        type: string

      max_tokens:
        description: "Maximum generated tokens per sample"
        required: true
        default: "64"
        type: string

      results_repo:
        description: "HF results repo"
        required: true
        default: "sparsetrace/DAC-d32-results"
        type: string

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 370

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Modal
        run: |
          python -m pip install --upgrade pip
          pip install modal

      - name: Deploy diagnostics
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          modal deploy diagnostics.py

      - name: Run diagnostics
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          MODE="${{ inputs.mode }}"
          FLAGS=()

          case "$MODE" in
            all)
              ;;
            bpb)
              FLAGS+=(--no-do-icl --no-do-core --no-do-sample)
              ;;
            icl)
              FLAGS+=(--no-do-bpb --no-do-core --no-do-sample)
              ;;
            core)
              FLAGS+=(--no-do-bpb --no-do-icl --no-do-sample)
              ;;
            sample)
              FLAGS+=(--no-do-bpb --no-do-icl --no-do-core)
              ;;
            *)
              echo "Unknown mode: $MODE" >&2
              exit 2
              ;;
          esac

          CMD=(
            modal run diagnostics.py
            --state "${{ inputs.state }}"
            --step "${{ inputs.step }}"
            --eval-tokens "${{ inputs.eval_tokens }}"
            --icl-num-batches "${{ inputs.icl_num_batches }}"
            --device-batch-size "${{ inputs.device_batch_size }}"
            --max-per-task "${{ inputs.max_per_task }}"
            --num-samples "${{ inputs.num_samples }}"
            --max-tokens "${{ inputs.max_tokens }}"
            --results-repo "${{ inputs.results_repo }}"
          )

          if [ -n "${{ inputs.repo }}" ]; then
            CMD+=(--repo "${{ inputs.repo }}")
          fi

          if [ -n "${{ inputs.run_tag }}" ]; then
            CMD+=(--run-tag "${{ inputs.run_tag }}")
          fi

          if [ -n "${{ inputs.operator_override }}" ]; then
            CMD+=(--operator-override "${{ inputs.operator_override }}")
          fi

          CMD+=("${FLAGS[@]}")

          printf 'Running:'
          printf ' %q' "${CMD[@]}"
          printf '\n'

          "${CMD[@]}"
