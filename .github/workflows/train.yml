# .github/workflows/train.yml
name: Train nanochat on Modal

on:
  workflow_dispatch:
    inputs:
      depth:
        description: "Transformer depth (nanochat's single complexity dial)"
        required: false
        default: "12"
      hf_repo:
        description: "HuggingFace repo for checkpoints, e.g. yourname/nanochat"
        required: false
        default: "yourname/nanochat"   # <-- change to your HF username/repo
      save_every:
        description: "Checkpoint every N steps"
        required: false
        default: "1000"
      extra_args:
        description: "Extra base_train flags, e.g. --device-batch-size=16"
        required: false
        default: ""

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # runner only launches; training continues on Modal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Modal
        run: pip install modal

      - name: Launch training (detached)
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          modal run --detach modal_train.py \
            --depth "${{ inputs.depth }}" \
            --hf-repo "${{ inputs.hf_repo }}" \
            --save-every "${{ inputs.save_every }}" \
            --extra-args "${{ inputs.extra_args }}"
