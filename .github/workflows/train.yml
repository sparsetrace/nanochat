# .github/workflows/train.yml
name: Train nanochat on Modal

on:
  workflow_dispatch:
    inputs:
      depth:
        description: "Transformer depth (nanochat's single complexity dial)"
        required: false
        default: "12"
      hf_repo:
        description: "HuggingFace repo for checkpoints (leave empty to use vars.HF_REPO)"
        required: false
        default: ""
      save_every:
        description: "Checkpoint every N steps"
        required: false
        default: "1000"
      window_pattern:
        description: "Attention window pattern: L = full causal context (default), SSSL = upstream sliding-window"
        required: false
        default: "L"
      extra_args:
        description: "Extra base_train flags, e.g. --device-batch-size=8"
        required: false
        default: ""

jobs:
  launch:
    runs-on: ubuntu-latest
    # Deploy (incl. image build with uv sync) can take a while on commits that
    # change the repo; the spawn itself is instant. Once spawned, training is
    # fully detached — nothing on the GitHub side can cancel it.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Modal
        run: pip install modal

      - name: Deploy app
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: modal deploy modal_train.py

      - name: Spawn training (fire-and-forget)
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          DEPTH: ${{ inputs.depth }}
          HF_REPO: ${{ inputs.hf_repo || vars.HF_REPO }}
          SAVE_EVERY: ${{ inputs.save_every }}
          WINDOW_PATTERN: ${{ inputs.window_pattern }}
          EXTRA_ARGS: ${{ inputs.extra_args }}
        run: |
          python -c "
          import os, modal
          f = modal.Function.from_name('nanochat', 'train_nanochat')
          call = f.spawn(
              depth=int(os.environ['DEPTH']),
              hf_repo=os.environ['HF_REPO'],
              save_every=int(os.environ['SAVE_EVERY']),
              window_pattern=os.environ['WINDOW_PATTERN'],
              extra_args=os.environ['EXTRA_ARGS'],
          )
          print('launched, call id:', call.object_id)
          "
