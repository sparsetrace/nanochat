# .github/workflows/d32cmap.yml
# CMAP graft from the ORIGINAL Karpathy d32: warm-start from
# karpathy/nanochat-d32:model_000650.pt (vintage strict-with-allowlist +
# graft-neutral handling) and continue pretraining under CMAP —
# indefinite kinetic + Doob, the (beta,alpha)=(1,1) corner:
#
#   s = 1/2<m,m> - 1/2<n,n> + 1/2(g_i - g_j)
#     = 1/2(<q_i,k_j> + <k_i,q_j>) + 1/2(g_i - g_j)
#
# This is the apples-to-apples sibling of the d32ft AMAP run: SAME vintage
# seed, SAME graft-neutral bootstrap, SAME reconditioning recipe — only the
# operator corner differs. Compare their ICL/induction CSVs directly.
#
# REUSES the modal_d32ft.py harness unchanged: it already implements the
# vintage bootstrap, and the operator arrives purely via VARIANT_ARGS.
# run_tag and HF_REPO are distinct so checkpoints/latest/ never mix with
# the AMAP run's. (Cosmetic note: that harness's provenance JSON hardcodes
# the string "HMAP alpha=0.0 (AMAP)" — the actual recorded extra_args below
# are the ground truth for what trained.)
#
# PREREQUISITES on the fork (checked implicitly: --hmap-beta is an
# unrecognized argument and argparse aborts loudly if the plumbing is
# missing):
#   - nanochat/gpt.py patched via apply_cmap_patch.py (adds hmap_beta)
#   - scripts/base_train.py exposes --hmap-beta wired into GPTConfig
name: d32 -> CMAP (from Karpathy seed)

on:
  workflow_dispatch:
    inputs:
      run_tag:
        description: "Run/checkpoint identity for THIS experiment"
        required: false
        default: "d32cmap"

      resume:
        description: "auto=resume own ckpt if any, else bootstrap from Karpathy seed; never=always bootstrap; force=require own ckpt"
        type: choice
        options:
          - auto
          - never
          - force
        required: false
        default: "auto"

      num_gpus:
        description: "H100 count"
        required: false
        default: "8"

      add_steps:
        description: "NEW steps this launch (AMAP arm ran 1600 + 1400 anneal = 3000 total)"
        required: false
        default: "1600"

      save_every:
        description: "Checkpoint every N steps"
        required: false
        default: "250"

      data_shards:
        description: "nanochat base-data shards to ensure downloaded"
        required: false
        default: "240"

      extra_args:
        description: "Extra base_train args (last-wins over VARIANT_ARGS below)"
        required: false
        default: ""

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Modal
        run: pip install modal

      - name: Deploy d32ft app (snapshots the CMAP-patched fork)
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: modal deploy modal_d32ft.py

      - name: Spawn d32 -> CMAP training
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

          # Separate repo: keeps latest/ and checkpoints/ disjoint from the
          # AMAP run's artifacts in sparsetrace/d32ft.
          HF_REPO: sparsetrace/d32cmap
          RUN_TAG: ${{ inputs.run_tag }}
          NUM_GPUS: ${{ inputs.num_gpus }}
          RESUME: ${{ inputs.resume }}
          ADD_STEPS: ${{ inputs.add_steps }}
          SAVE_EVERY: ${{ inputs.save_every }}
          DATA_SHARDS: ${{ inputs.data_shards }}
          EXTRA_ARGS: ${{ inputs.extra_args }}

          # Identical to the d32ft AMAP reconditioning recipe except the
          # operator corner: alpha=1 beta=1 (CMAP) instead of alpha=0 (AMAP).
          # Eager path: device-batch-size=4 is the validated d32 footprint.
          VARIANT_ARGS: >-
            --attn-variant=hmap
            --hmap-alpha=1.0
            --hmap-beta=1.0
            --device-batch-size=4
            --total-batch-size=524288
            --embedding-lr=0.03
            --unembedding-lr=0.0008
            --matrix-lr=0.002
            --scalar-lr=0.05
            --weight-decay=0.0
            --warmup-steps=40
            --warmdown-ratio=0.0
            --final-lr-frac=1.0
            --core-metric-every=-1
            --eval-every=100
            --sample-every=250

        run: |
          python - <<'PY'
          import modal
          import os

          f = modal.Function.from_name("nanochat-d32ft", "train_d32ft")

          num_gpus = int(os.environ["NUM_GPUS"])
          gpu_request = "H100" if num_gpus == 1 else f"H100:{num_gpus}"
          extra = (
              os.environ["VARIANT_ARGS"] + " " + os.environ["EXTRA_ARGS"]
          ).strip()

          f = f.with_options(gpu=gpu_request)

          call = f.spawn(
              hf_repo=os.environ["HF_REPO"],
              run_tag=os.environ["RUN_TAG"],
              num_gpus=num_gpus,
              resume=os.environ["RESUME"],
              add_steps=int(os.environ["ADD_STEPS"]),
              save_every=int(os.environ["SAVE_EVERY"]),
              data_shards=int(os.environ["DATA_SHARDS"]),
              extra_args=extra,
          )

          print("launched, call id:", call.object_id)
          PY
