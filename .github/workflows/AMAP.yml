# .github/workflows/AMAP.yml — HMAP with alpha=0 (kinetic + flux) = AMAP
name: Train nanochat (AMAP)

on:
  workflow_dispatch:
    inputs:
      depth:
        description: "Transformer depth"
        required: false
        default: "12"
      run_tag:
        description: "Run name (checkpoints/logs/HF paths)"
        required: false
        default: "d12-a00"
      resume:
        description: "Resume policy: auto = continue if <variant>/latest/ matches this run_tag+depth; never; force"
        type: choice
        options:
          - auto
          - never
          - force
        required: false
        default: "auto"
      add_steps:
        description: "Additive step budget: fresh run trains N steps; relaunch trains N MORE. -1 = full compute-optimal horizon"
        required: false
        default: "-1"
      save_every:
        description: "Checkpoint every N steps"
        required: false
        default: "1000"
      extra_args:
        description: "Extra base_train flags (variant flags already included)"
        required: false
        default: ""

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Modal
        run: pip install modal
      - name: Deploy app
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: modal deploy modal_train.py
      - name: Spawn training (fire-and-forget)
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          DEPTH: ${{ inputs.depth }}
          RUN_TAG: ${{ inputs.run_tag }}
          RESUME: ${{ inputs.resume }}
          ADD_STEPS: ${{ inputs.add_steps }}
          SAVE_EVERY: ${{ inputs.save_every }}
          EXTRA_ARGS: ${{ inputs.extra_args }}
          HF_SUBFOLDER: AMAP
          VARIANT_ARGS: "--attn-variant hmap --hmap-alpha 0.0 --device-batch-size=8 --core-metric-every=-1"
        run: |
          python -c "
          import os, modal
          f = modal.Function.from_name('nanochat', 'train_nanochat')
          extra = (os.environ['VARIANT_ARGS'] + ' ' + os.environ['EXTRA_ARGS']).strip()
          call = f.spawn(
              depth=int(os.environ['DEPTH']),
              hf_subfolder=os.environ['HF_SUBFOLDER'],
              save_every=int(os.environ['SAVE_EVERY']),
              run_tag=os.environ['RUN_TAG'],
              resume=os.environ['RESUME'],
              add_steps=int(os.environ['ADD_STEPS']),
              extra_args=extra,
          )
          print('launched, call id:', call.object_id)
          "
