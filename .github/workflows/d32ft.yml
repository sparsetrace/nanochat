# .github/workflows/d32ft.yml
name: Recondition nanochat d32 (AMAP)

on:
  workflow_dispatch:
    inputs:
      run_tag:
        description: "Run/checkpoint identity"
        required: false
        default: "d32ft-amap"

      resume:
        description: "auto=own ckpt else Karpathy; never=re-bootstrap; force=require own ckpt"
        type: choice
        options:
          - auto
          - never
          - force
        required: false
        default: "auto"

      num_gpus:
        description: "H100 count (8 = one optimizer step per 8 accum micro-steps at batch 4; 1-GPU d32 is a multi-day slog)"
        required: false
        default: "8"

      add_steps:
        description: "NEW optimization steps this launch (auto-resume continues from the newest checkpoint in latest/)"
        required: false
        default: "1500"

      save_every:
        description: "Checkpoint every N steps (~1-2h apart at 8xH100 d32-eager)"
        required: false
        default: "100"

      data_shards:
        description: "nanochat base-data shards to ensure downloaded (1000 steps x 0.5M tokens needs ~15; 60 gives headroom)"
        required: false
        default: "60"

      extra_args:
        description: "Override/append base_train flags (argparse last-wins over VARIANT_ARGS)"
        required: false
        default: ""

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Modal
        run: pip install modal

      - name: Deploy d32ft app
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: modal deploy modal_d32ft.py

      - name: Spawn d32 AMAP reconditioning
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

          HF_REPO: sparsetrace/d32ft
          RUN_TAG: ${{ inputs.run_tag }}
          NUM_GPUS: ${{ inputs.num_gpus }}
          RESUME: ${{ inputs.resume }}
          ADD_STEPS: ${{ inputs.add_steps }}
          SAVE_EVERY: ${{ inputs.save_every }}
          DATA_SHARDS: ${{ inputs.data_shards }}
          EXTRA_ARGS: ${{ inputs.extra_args }}

          # modal_d32ft.py hardcodes:
          #   depth=32
          #   window_pattern=L
          #
          # HMAP alpha=0 is AMAP; the warm start loads Karpathy's weights with
          # vintage-aware allowlisting and graft-neutral scalar overrides.
          #
          # --device-batch-size=4: an 80GB H100 is massively underutilized at
          # batch 1 (d12-AMAP at batch 8 peaked at 15.4GB); batch 4 cuts grad
          # accumulation 4x. If it OOMs (visible in the first minutes), rerun
          # with extra_args: --device-batch-size=2
          #
          # At 8xH100 + batch 4: 524288/(8*4*2048) = 16 accum micro-steps per
          # optimizer step. At 1 GPU + batch 1 it would be 256 — a multi-day,
          # many-resume slog for the same dollars.
          #
          # These LRs are deliberately 0.1x-ish scratch-pretraining values.
          # Weight decay is disabled during reconditioning. Warmdown is disabled
          # so relaunching an additive Modal chunk does not move the LR endpoint.
          #
          # 524288 tokens/step matches Karpathy's historical d32 effective batch.
          VARIANT_ARGS: >-
            --attn-variant=hmap
            --hmap-alpha=0.0
            --device-batch-size=4
            --total-batch-size=524288
            --embedding-lr=0.03
            --unembedding-lr=0.0008
            --matrix-lr=0.002
            --scalar-lr=0.05
            --weight-decay=0.0
            --warmup-steps=40
            --warmdown-ratio=0.0
            --final-lr-frac=1.0
            --core-metric-every=-1
            --eval-every=100
            --sample-every=250

        run: |
          python - <<'PY'
          import modal
          import os

          f = modal.Function.from_name("nanochat-d32ft", "train_d32ft")

          num_gpus = int(os.environ["NUM_GPUS"])
          gpu_request = "H100" if num_gpus == 1 else f"H100:{num_gpus}"
          extra = (
              os.environ["VARIANT_ARGS"] + " " + os.environ["EXTRA_ARGS"]
          ).strip()

          f = f.with_options(gpu=gpu_request)

          call = f.spawn(
              hf_repo=os.environ["HF_REPO"],
              run_tag=os.environ["RUN_TAG"],
              num_gpus=num_gpus,
              resume=os.environ["RESUME"],
              add_steps=int(os.environ["ADD_STEPS"]),
              save_every=int(os.environ["SAVE_EVERY"]),
              data_shards=int(os.environ["DATA_SHARDS"]),
              extra_args=extra,
          )

          print("launched, call id:", call.object_id)
          PY
