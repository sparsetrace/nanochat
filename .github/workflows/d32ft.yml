# .github/workflows/d32ft-finish.yml
# Finishing chunk for the d32 AMAP reconditioning: +1400 steps to horizon 3000,
# WITH an LR anneal over the final 25% (overriding the reconditioning default
# of no-warmdown). This converts the constant-LR oscillation into loss and
# freezes the induction circuit at its basin value — the declared endpoint.
#
# Uses the UNCHANGED modal_d32ft.py deployment (same spawn signature); the
# anneal arrives purely via extra_args (argparse last-wins over VARIANT_ARGS).
name: Finish d32 AMAP (anneal to 3000)

on:
  workflow_dispatch:
    inputs:
      run_tag:
        description: "Run/checkpoint identity (must match the reconditioning run)"
        required: false
        default: "d32ft-amap"

      resume:
        description: "auto (expects the step-1600 checkpoint); force=require own ckpt"
        type: choice
        options:
          - auto
          - force
        required: false
        default: "auto"

      num_gpus:
        description: "H100 count"
        required: false
        default: "8"

      add_steps:
        description: "NEW steps this launch (1400 -> horizon 3000)"
        required: false
        default: "1400"

      save_every:
        description: "Checkpoint every N steps"
        required: false
        default: "100"

      data_shards:
        description: "nanochat base-data shards to ensure downloaded"
        required: false
        default: "60"

      extra_args:
        description: "Anneal overrides (last-wins over VARIANT_ARGS). Default warms the LR down over the final 750 steps to 0.1x"
        required: false
        default: "--warmdown-ratio=0.25 --final-lr-frac=0.1"

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Modal
        run: pip install modal

      - name: Deploy d32ft app
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: modal deploy modal_d32ft.py

      - name: Spawn d32 AMAP finishing anneal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

          HF_REPO: sparsetrace/d32ft
          RUN_TAG: ${{ inputs.run_tag }}
          NUM_GPUS: ${{ inputs.num_gpus }}
          RESUME: ${{ inputs.resume }}
          ADD_STEPS: ${{ inputs.add_steps }}
          SAVE_EVERY: ${{ inputs.save_every }}
          DATA_SHARDS: ${{ inputs.data_shards }}
          EXTRA_ARGS: ${{ inputs.extra_args }}

          # Same reconditioning recipe as d32ft.yml; the anneal flags in
          # EXTRA_ARGS override --warmdown-ratio=0.0 / --final-lr-frac=1.0
          # below (argparse last-wins).
          VARIANT_ARGS: >-
            --attn-variant=hmap
            --hmap-alpha=0.0
            --device-batch-size=4
            --total-batch-size=524288
            --embedding-lr=0.03
            --unembedding-lr=0.0008
            --matrix-lr=0.002
            --scalar-lr=0.05
            --weight-decay=0.0
            --warmup-steps=40
            --warmdown-ratio=0.0
            --final-lr-frac=1.0
            --core-metric-every=-1
            --eval-every=100
            --sample-every=250

        run: |
          python - <<'PY'
          import modal
          import os

          f = modal.Function.from_name("nanochat-d32ft", "train_d32ft")

          num_gpus = int(os.environ["NUM_GPUS"])
          gpu_request = "H100" if num_gpus == 1 else f"H100:{num_gpus}"
          extra = (
              os.environ["VARIANT_ARGS"] + " " + os.environ["EXTRA_ARGS"]
          ).strip()

          f = f.with_options(gpu=gpu_request)

          call = f.spawn(
              hf_repo=os.environ["HF_REPO"],
              run_tag=os.environ["RUN_TAG"],
              num_gpus=num_gpus,
              resume=os.environ["RESUME"],
              add_steps=int(os.environ["ADD_STEPS"]),
              save_every=int(os.environ["SAVE_EVERY"]),
              data_shards=int(os.environ["DATA_SHARDS"]),
              extra_args=extra,
          )

          print("launched, call id:", call.object_id)
          PY
